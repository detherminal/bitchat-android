name: Android CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android SDK components
      run: |
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;28.0.13004108"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew --no-daemon --stacktrace -Djava.net.preferIPv4Stack=true testDebugUnitTest

    - name: Run lint
      run: ./gradlew --no-daemon --stacktrace -Djava.net.preferIPv4Stack=true lintDebug

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          **/build/test-results/
          **/build/reports/tests/

    - name: Upload lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: '**/build/reports/lint-results-*.html'

  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        variant: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android SDK components
      run: |
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;28.0.13004108"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ${{ matrix.variant }} APK
      run: ./gradlew --no-daemon --stacktrace -Djava.net.preferIPv4Stack=true assemble${{ matrix.variant }}

    - name: Upload ${{ matrix.variant }} APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.variant }}-apk
        path: app/build/outputs/apk/**/*.apk
